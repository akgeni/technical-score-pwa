<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Technical Score</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Technical Score</a>
    <div class="topbar-actions">
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast" hidden></div>

  <dialog id="settings-dialog">
    <form id="settings-form">
      <h3>Settings</h3>
      <label for="api-key-input">Twelve Data API key</label>
      <input id="api-key-input" type="text" placeholder="Paste your free Twelve Data API key" autocomplete="off">
      <p class="hint">
        Get a free key at
        <a href="https://twelvedata.com/pricing" target="_blank" rel="noopener">twelvedata.com</a>
        (no card needed). Free tier: 8 requests/min, 800/day — refreshing many stocks is
        paced automatically. The key is stored only on this device (localStorage), never sent
        anywhere except directly to Twelve Data's API.
      </p>
      <div class="dialog-actions">
        <button type="button" id="btn-cancel-settings" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
